<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- soft plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0f172a"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#fill)"/>
  <!-- sparkline path (growth) -->
  <path d="M24 92 C 40 78, 48 86, 58 70 S 78 48, 92 40 S 108 28, 112 24"
        fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- end dots: copies cyan, hearts rose -->
  <circle cx="58" cy="70" r="5" fill="#22d3ee"/>
  <circle cx="112" cy="24" r="7" fill="#fb7185"/>
  <!-- tiny heart mark near end -->
  <path d="M104 38 c0-3 2.5-5 5-5 s5 2 5 5 c0 4-5 8-5 8 s-5-4-5-8z" fill="#fb7185" opacity="0.95"/>
</svg>
