<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!--
    Theme-agnostic Plugin Pulse mark:
    - Transparent plate (no baked dark tile that clashes with light themes)
    - Same sparkline language as PulseIcon.qml (dip, then rise)
    - Soft underfill + dual stroke (dark halo + light line) so it reads on any toast bg
  -->
  <defs>
    <linearGradient id="fill" x1="20" y1="24" x2="20" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- gentle outer glow for light backgrounds -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Normalized PulseIcon points mapped into a padded 24..104 box:
       [0.00,0.78] [0.22,0.62] [0.40,0.70] [0.62,0.42] [0.82,0.28] [1.00,0.12]
  -->
  <path id="curve"
        d="M24 86.4 L41.6 73.6 L56 80 L73.6 57.6 L89.6 46.4 L104 33.6"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Soft area under the curve -->
  <path d="M24 104 L24 86.4 L41.6 73.6 L56 80 L73.6 57.6 L89.6 46.4 L104 33.6 L104 104 Z"
        fill="url(#fill)"/>

  <!-- Dark halo (readable on light toasts) -->
  <use href="#curve" stroke="#0b1220" stroke-width="11" stroke-opacity="0.55" filter="url(#soft)"/>

  <!-- Main light stroke (readable on dark toasts) -->
  <use href="#curve" stroke="#f8fafc" stroke-width="7"/>

  <!-- End observation dot — dual ring -->
  <circle cx="104" cy="33.6" r="9" fill="#0b1220" fill-opacity="0.45"/>
  <circle cx="104" cy="33.6" r="6.5" fill="#f8fafc"/>
</svg>
